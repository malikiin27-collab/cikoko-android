name: APK Cikoko

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Pasang SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Periksa struktur proyek
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          gradle :app:tasks --all

      - name: Buat APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Cikoko-Pegawai-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
