plugins { id 'com.android.application' }
android {
 namespace 'id.cikoko.pegawai'
 buildFeatures { buildConfig true }
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'id.cikoko.pegawai'; minSdk 26; targetSdk 35; versionCode 24; versionName '2.3.1'; resValue 'string', 'app_name', 'Cikoko' }
 def signingFile = System.getenv('CI_KEYSTORE_PATH')
 signingConfigs {
  ciRelease {
   if (signingFile) {
    storeFile file(signingFile)
    storePassword System.getenv('CI_STORE_PASSWORD')
    keyAlias System.getenv('CI_KEY_ALIAS')
    keyPassword System.getenv('CI_KEY_PASSWORD')
   }
  }
 }
 buildTypes { debug { applicationIdSuffix '.uji2'; versionNameSuffix '-uji'; resValue 'string', 'app_name', 'Cikoko' }; release { if (signingFile) signingConfig signingConfigs.ciRelease; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.android.gms:play-services-location:21.3.0'; implementation 'androidx.core:core:1.13.1'; implementation 'androidx.webkit:webkit:1.12.1' }
