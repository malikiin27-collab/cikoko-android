name: APK Cikoko Tracking
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      CI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Pasang Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Uji aturan GPS
        run: |
          mkdir -p build/policy-tests
          javac -d build/policy-tests app/src/main/java/id/cikoko/pegawai/TrackingPolicy.java tests/id/cikoko/pegawai/TrackingPolicyTest.java
          java -cp build/policy-tests id.cikoko.pegawai.TrackingPolicyTest
      - name: Siapkan signing resmi jika tersedia
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$CI_STORE_PASSWORD"
            test -n "$CI_KEY_ALIAS"
            test -n "$CI_KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cikoko-release.jks"
            chmod 600 "$RUNNER_TEMP/cikoko-release.jks"
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/cikoko-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK uji dan lint
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Build APK rilis dengan signing lama
        if: env.CI_KEYSTORE_PATH != ''
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Cikoko-Tracking-APK-Uji
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.CI_KEYSTORE_PATH != ''
        with:
          name: Cikoko-Tracking-APK-Resmi
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Hapus signing sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/cikoko-release.jks"
